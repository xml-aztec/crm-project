[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["xml-aztec <asankozhoevn@gmail.com>"]
readme = "README.md"

packages = [
  { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["all"], version = "^0.141.1"}
sqlalchemy = "^2.0.41"
asyncpg = "^0.30.0"
greenlet = "^3.2.2"
pydantic = "^2.11.5"
pydantic-settings = "^2.9.1"
alembic = "^1.16.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^3.2.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
# Пиним явно (иначе тянется транзитивно через python-jose[cryptography] без
# нижней границы) — используется для подписи JWT, было 9 известных advisory
# на 45.0.3.
cryptography = "^50.0.1"
qrcode = "^8.2"
pillow = "^12.3.0"
jinja2 = "^3.1.6"
pdfkit = "^1.0.0"
structlog = "^24.4.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.19.0"}
slowapi = "^0.1.9"
resend = "^2.32.2"
openpyxl = "^3.1.5"
apscheduler = "^3.11.0"
boto3 = "^1.43.83"


[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^6.0.1"
mypy = "^1.15.0"
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.0"
asgi-lifespan = "^2.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
