databases:
  - name: crm-db
    databaseName: crm_db
    user: crm
    plan: free

services:
  - type: web
    name: crm-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Super Admin
      # BASE_URL / FRONTEND_URL: не заданы намеренно — Settings подхватит их
      # из RENDER_EXTERNAL_URL, который Render прокидывает автоматически
      # (см. backend/app/core/config.py::_default_urls_from_render).
