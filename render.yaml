databases:
  - name: crm-db
    databaseName: crm_db
    user: crm
    plan: free

services:
  - type: web
    name: crm-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Super Admin
      # BASE_URL / FRONTEND_URL: не заданы намеренно — Settings подхватит их
      # из RENDER_EXTERNAL_URL, который Render прокидывает автоматически
      # (см. backend/app/core/config.py::_default_urls_from_render).
      # Хранилище изображений товаров (Cloudflare R2) — задать вручную в
      # Render dashboard. Бакет должен быть настроен на публичное чтение и
      # с CORS, разрешающим PUT/GET с домена фронтенда (см. app/utils/storage.py).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
