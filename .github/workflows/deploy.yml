name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/crm_db
      # Значение только для прогона тестов — подписывает JWT внутри одного
      # job'а и никуда не уходит. Раньше здесь был ${{ secrets.SECRET_KEY }}:
      # если секрет в репозитории не задан, переменная приезжала пустой строкой
      # и падение было неочевидным.
      SECRET_KEY: ci-test-secret-key-not-used-outside-ci
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: testpassword123
      ADMIN_FULL_NAME: Test Admin
      BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install --with dev

      # Отдельная проверка, что цепочка миграций накатывается на пустую базу.
      # Тесты её не покрывают: они поднимают схему через init_db() на своей
      # базе crm_db_test, поэтому расхождение моделей и alembic/ раньше
      # прошло бы в main незамеченным.
      - name: Verify migrations apply from empty database
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: poetry run pytest -v
