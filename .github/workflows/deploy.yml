name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/crm_db
      # Значение только для прогона тестов — подписывает JWT внутри одного
      # job'а и никуда не уходит. Раньше здесь был ${{ secrets.SECRET_KEY }}:
      # если секрет в репозитории не задан, переменная приезжала пустой строкой
      # и падение было неочевидным.
      SECRET_KEY: ci-test-secret-key-not-used-outside-ci
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: testpassword123
      ADMIN_FULL_NAME: Test Admin
      BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install --with dev

      # Отдельная проверка, что цепочка миграций накатывается на пустую базу.
      # Тесты её не покрывают: они поднимают схему через init_db() на своей
      # базе crm_db_test, поэтому расхождение моделей и alembic/ раньше
      # прошло бы в main незамеченным.
      - name: Verify migrations apply from empty database
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: poetry run pytest -v

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Линтер до этого не был подключён ни к одной проверке и накопил
      # 162 ошибки. Сейчас их ноль, и шаг держит счётчик на нуле.
      # Восемь оставшихся предупреждений (exhaustive-deps, react-refresh)
      # сборку не валят — предел выставлен по текущему уровню, чтобы новые
      # не добавлялись незаметно.
      - name: Lint
        working-directory: frontend
        run: npx eslint . --max-warnings 8

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # tsc -b отдельно от vite build: vite не проверяет типы при сборке,
      # так что без этого шага ошибки типизации в CI не видны.
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
